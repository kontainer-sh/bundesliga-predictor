name: Submit-Tips

# Manuell auslösbar + täglicher Cron. Der geplante Lauf ist SCHARF (gibt seit
# 2026-09-03 wirklich ab). Zum Zurückschalten auf Dry-Run unten im Run-Step
# SUBMIT_ON_SCHEDULE=false setzen.
on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Wirklich abgeben? (aus = Dry-Run, nur Anzeige)"
        type: boolean
        default: false
      diagnose:
        description: "Nur Formularstruktur ausgeben (sanitisiert, gibt nichts ab)"
        type: boolean
        default: false
  schedule:
    # Täglich 03:00 UTC (~05:00 MESZ). GitHub-Cron driftet teils um Stunden;
    # daily + --overwrite fängt das ab (mehrere Versuche/Woche, letzter vor der
    # Deadline zählt). --allow-no-games hält Tage ohne offenen Spieltag grün.
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Submit tips
        env:
          KICKTIPP_EMAIL: ${{ secrets.KICKTIPP_EMAIL }}
          KICKTIPP_PASSWORD: ${{ secrets.KICKTIPP_PASSWORD }}
          KICKTIPP_COMMUNITY: ${{ secrets.KICKTIPP_COMMUNITY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        # SCHEDULE (Cron): SCHARF → "--submit --overwrite --allow-no-games".
        #   Zum Zurückschalten auf Dry-Run SUBMIT_ON_SCHEDULE=false setzen (Cron
        #   läuft dann mit "--overwrite --allow-no-games", gibt nichts ab).
        # DISPATCH (manuell): diagnose > submit-Input > Dry-Run (unverändert).
        run: |
          SUBMIT_ON_SCHEDULE=true
          if [ "${{ github.event.inputs.diagnose }}" = "true" ]; then
            python submit_tips.py --diagnose
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$SUBMIT_ON_SCHEDULE" = "true" ]; then
              python submit_tips.py --submit --overwrite --allow-no-games
            else
              python submit_tips.py --overwrite --allow-no-games
            fi
          elif [ "${{ github.event.inputs.submit }}" = "true" ]; then
            python submit_tips.py --submit
          else
            python submit_tips.py
          fi
