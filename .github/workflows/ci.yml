name: CI

on:
  push:
    branches: [main]
    paths-ignore: # keine Tests bei automatischen Tipp-Commits
      - "tips/**"
      - "docs/**"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python test.py
